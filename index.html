<!doctype html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1' />

  <title>%VITE_APP_TITLE% — Film photography by Daniel da Silva</title>
  <meta name="description" content="%VITE_APP_DESCRIPTION%">
  <link rel="canonical" href="%VITE_BASE_URL%/" vite-ignore>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="%VITE_APP_TITLE%">
  <meta property="og:title" content="%VITE_APP_TITLE% — Film photography by Daniel da Silva">
  <meta property="og:description" content="%VITE_APP_DESCRIPTION%">
  <meta property="og:url" content="%VITE_BASE_URL%/">
  <meta property="og:image" content="%VITE_BASE_URL%/meta/meta-image.jpg">
  <meta property="og:image:width" content="2880">
  <meta property="og:image:height" content="1440">
  <meta property="og:image:alt" content="%VITE_APP_TITLE% title next to a Yashica FX-3 Super 2000 film camera">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="%VITE_BASE_URL%/meta/favicon.png" type='image/png' sizes="96x96">
  <link rel="icon" href="%VITE_BASE_URL%/meta/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="%VITE_BASE_URL%/meta/apple-touch-icon.png">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">

  <!-- Styles the static fallback below before the app's CSS loads. Colors
       and fonts mirror app/styles/theme.css. -->
  <style>
    html {
      background: #000;
      color: #f1ece3;
    }

    .boot {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      text-align: center;
      font: 0.75rem/1.5 'JetBrains Mono', ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9b948a;
      /* Fades in late, so fast loads never flash it. */
      animation: boot-in 0.6s ease-out 0.4s both;
    }

    .boot h1 {
      margin: 0;
      font: 400 clamp(4rem, 15vw, 10rem)/0.85 Anton, Impact, sans-serif;
      letter-spacing: 0;
      color: #f1ece3;
    }

    .boot p {
      max-width: 32rem;
      margin: 0;
    }

    .boot a {
      color: #f1ece3;
      text-underline-offset: 0.25rem;
    }

    /* Loading bar: a short light sweeping along a hairline. */
    .boot::after {
      content: '';
      width: 8rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e3a548, transparent) 0 0 / 50% 100% no-repeat #2b2825;
      animation: boot-sweep 1.4s ease-in-out infinite;
    }

    @keyframes boot-in {
      from {
        opacity: 0;
      }
    }

    @keyframes boot-sweep {
      from {
        background-position: -100% 0;
      }
      to {
        background-position: 200% 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot,
      .boot::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id='app-container'>
    <!-- Static fallback for crawlers that don't run JavaScript. React
         replaces it on render. -->
    <div class='boot'>
      <h1>%VITE_APP_TITLE%</h1>
      <p>%VITE_APP_DESCRIPTION%</p>
      <p>A project by <a href="https://danielfdsilva.com/">Daniel da Silva</a></p>
    </div>
  </div>

  <script>
    // https://stackoverflow.com/a/9851769/728583

    // internet explorer 6-11
    var isIE = /*@cc_on!@*/ false || !!document.documentMode;

    if (isIE) {
      document.body.innerHTML =
        'Unfortunately, your browser is not currently supported.<br />Recommended browsers: Edge, Firefox, Safari, Chrome';
    }
  </script>


  <script src="./app/main.tsx" type="module"></script>
</body>

</html>
